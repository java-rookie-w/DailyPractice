# ============================================================================
# profile: idempotency-skeleton —— 练习版骨架（idempotency_skeleton 包）专用。
# 内容与 application-idempotency.yml 完全一致：队列名在代码常量里带 .sk 后缀，
# 两边互不干扰。
# ============================================================================
spring:
  rabbitmq:
    listener:
      simple:
        # 硬冲突项：helloworld 要 auto，本 demo 必须 manual
        acknowledge-mode: manual
        prefetch: 1
        # 演示阶段先单消费者，消息顺序才是确定的，日志好对照
        concurrency: 1
        max-concurrency: 1
        retry:
          # 手动 ACK 下本 demo 在 catch 里自己 nack，Spring 重试不参与，先关掉避免误判日志
          enabled: false

  # H2 控制台默认是**关闭**的（spring.h2.console.enabled 默认 false），不显式打开访问不了
  h2:
    console:
      enabled: true
      path: /h2-console

  datasource:
    # 必须写死库名：Boot 默认给内嵌库起**随机名**（generate-unique-name 默认 true），
    # 不指定的话，控制台里填 jdbc:h2:mem:default 连到的是另一个新建的空库，看不到表。
    # DB_CLOSE_DELAY=-1：连接全部关闭时也别销毁这个库，否则控制台一进去数据是空的。
    url: jdbc:h2:mem:rabbitmq-lab-sk;DB_CLOSE_DELAY=-1
    username: sa
    password:

# 内嵌库上 Boot 会自动执行 schema.sql（spring.sql.init.mode 默认 embedded），
# 建好 dedup_record（去重表）+ biz_order（业务表）并预置两笔待支付订单。
# 想亲眼看数据：http://localhost:8081/h2-console
#   JDBC URL 填上面的 jdbc:h2:mem:rabbitmq-lab-sk，用户名 sa，密码空
lab:
  client:
    duration: 60000
